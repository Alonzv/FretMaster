<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Background: Void Black -->
  <rect width="48" height="48" fill="#070709"/>

  <!-- Nut — the vertical anchor bar on the left -->
  <rect x="7" y="8" width="3" height="32" fill="#F0EDE8"/>

  <!-- Six strings — horizontal, thinning from low E (bottom) to high e (top) -->
  <rect x="7"  y="11" width="34" height="1"   fill="#3A3A58"/>
  <rect x="7"  y="16" width="34" height="1"   fill="#3A3A58"/>
  <rect x="7"  y="21" width="34" height="1.5" fill="#3A3A58"/>
  <rect x="7"  y="26" width="34" height="2"   fill="#3A3A58"/>
  <rect x="7"  y="31" width="34" height="2"   fill="#3A3A58"/>
  <rect x="7"  y="36" width="34" height="2.5" fill="#3A3A58"/>

  <!-- Fret lines -->
  <rect x="20" y="8" width="1.5" height="32" fill="#1A1A2E"/>
  <rect x="33" y="8" width="1.5" height="32" fill="#1A1A2E"/>

  <!-- Fingered note — Bauhaus Blue rectangle pressing string 2, fret 1 -->
  <rect x="11" y="13" width="8" height="6" fill="#2B50E8"/>

  <!-- Second note — Bauhaus Yellow, string 4, fret 2 -->
  <rect x="24" y="23" width="8" height="6" fill="#F5C200"/>

  <!-- Bauhaus accent stripe — top edge -->
  <rect x="0" y="0" width="48" height="2" fill="#2B50E8"/>
</svg>
